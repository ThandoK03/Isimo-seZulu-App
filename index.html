<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="index.css">
  </head>

  <body>
    <div>
      <h1>
        😄
        <br />
        Currently 21° in Tokyo
      </h1>

        13° /
        <strong> 23° </strong>
      </h2>

        <li>
          <h3>⛅Tomorrow</h3>
          <p>
            10° /
            <strong>22°</strong>
          </p>
        </li>
        <li>
          <h3>🌦️ Saturday</h3>
          <p>
            15° /
            <strong>17°</strong>
          </p>
        </li>
        <li>
          <h3>🌤️ Sunday</h3>
          <p>
            16° /
            <strong>21°</strong>
          </p>
        </li>
      </ul>
      
      <button>Change City</button>
      <footer>Coded by Thando Kheswa</footer>
    </div>
  </body>
</html>
