<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    
    <link rel="stylesheet" href="index.css">
  </head>

  <body>
    <div class = "weather-app">
       <header>
      <form class =search-form id="search-form">
        <input type="search" placeholder="Enter a city..." required id="search-form-input" class="search-form-input">
        <input type="submit" value="Search" class="search-form-button">
      </form>
    </header>
    
<main>
    <div class = "weather-info">
    <div>
    <h1 class = "weather-app-city" id="city">
    </h1>
    <p class="weather-app-details" >
        <span id="time">,</span>
        
        <span id="description"></span>
        <br>
        Humidity:<strong id="humidity"> </strong>, Wind: <strong id="wind-speed"></strong>
    </p>
</div>

   <div class = "weather-app-temperature-container">
<div class = "weather-app-icon">⛅ </div>

<div class = "weather-app-temperature-value" id="temperature"></div>
<div class = "weather-app-unit">°C</div>

   </div> 
   </div>

</main>

</footer>
    </div>
    <script src="index.js"></script>
  </body>
</html>
