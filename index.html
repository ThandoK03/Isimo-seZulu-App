<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
  </head>
  <style>
    body {
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      background-color: #f5f5f5;
      color: blue;
      text-align: center;
      padding: 20px;
      font-size: 25px;
    }

    h1 {
      font-size: 2em;
      margin-bottom: 0.5em;
    }

    h2 {
      font-size: 1.5em;
      margin-bottom: 1em;
    }

    ul {
      list-style-type: none;
      padding: 0;
    }

    li {
      margin-bottom: 1em;
    }

    button {
      background-color: blueviolet;
      color: black;
      border: none;
      padding: 10px 20px;
      font-size: 1em;
      border-radius: 10px;
      transition: all 200ms ease-in-out;
    }

    button:hover {
      cursor: pointer;
      background-color: pink;
    }
  </style>
  <body>
    <div>
      <h1>
        😄
        <br />
        Currently 21° in Tokyo
      </h1>
      <h2>
        13° /
        <strong> 23° </strong>
      </h2>
      <ul>
        <li>
          <h3>⛅Tomorrow</h3>
          <p>
            10° /
            <strong>22°</strong>
          </p>
        </li>
        <li>
          <h3>🌦️ Saturday</h3>
          <p>
            15° /
            <strong>17°</strong>
          </p>
        </li>
        <li>
          <h3>🌤️ Sunday</h3>
          <p>
            16° /
            <strong>21°</strong>
          </p>
        </li>
      </ul>
      <script>
       
        function changeCity() {
          let city = prompt("Enter your city name?");
          let temperature = prompt("Enter the current temperature in your city?");
          let heading =document.querySelector("h1");
          if (temperature <0) {
            heading.innerHTML = `🥶 <br> Currently ${temperature}° in ${city}`;
          } else if (temperature >= 0 && temperature <= 15) {
            heading.innerHTML = `😐 <br> Currently ${temperature}° in ${city}`;
          } else if (temperature > 15 && temperature <= 25) {
            heading.innerHTML = `😄 <br> Currently ${temperature}° in ${city}`;
          } else if (temperature > 25) {
            heading.innerHTML = `🥵 <br> Currently ${temperature}° in ${city}`;
          }
        
        
        changeCity();

        let changeButton = document.querySelector("button");
        changeButton.addEventListener("click", changeCity); 

       
      </script>
      <button>Change City</button>
      <footer>Coded by Thando Kheswa</footer>
    </div>
  </body>
</html>
